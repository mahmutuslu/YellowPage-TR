name: Build YellowPage TR LSPosed APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'build-status.json'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate and prepare sources
        run: |
          python3 tools/test_spam.py
          bash tools/build-stubs.sh
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: python3 tools/verify_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: YellowPage-TR-LSPosed-v0.1-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  report:
    if: ${{ always() }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Write status for remote diagnosis
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,json
          result={
            "build_result":os.environ["BUILD_RESULT"],
            "run_id":int(os.environ["RUN_ID"]),
            "run_url":"https://github.com/%s/actions/runs/%s" % (os.environ["REPO"],os.environ["RUN_ID"]),
            "source_sha":os.environ["SOURCE_SHA"]
          }
          with open("build-status.json","w",encoding="utf-8") as f:
            json.dump(result,f,indent=2)
            f.write("\n")
          print(result)
          PY
      - name: Publish status (skip recursive builds)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: record build result [skip ci]"
          git push origin HEAD:main
