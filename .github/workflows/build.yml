name: Build YellowPage TR LSPosed APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'build-status.json'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK using runner tools
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate and prepare sources
        run: |
          python3 tools/test_spam.py
          bash tools/build-stubs.sh
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: python3 tools/verify_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: YellowPage-TR-LSPosed-v1.3-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  report:
    if: ${{ always() }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Write status for remote diagnosis
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,json
          result={
            "build_result":os.environ["BUILD_RESULT"],
            "run_id":int(os.environ["RUN_ID"]),
            "run_url":"https://github.com/%s/actions/runs/%s" % (os.environ["REPO"],os.environ["RUN_ID"]),
            "source_sha":os.environ["SOURCE_SHA"]
          }
          with open("build-status.json","w",encoding="utf-8") as f:
            json.dump(result,f,indent=2)
            f.write("\n")
          print(result)
          PY
      - name: Publish status (skip recursive builds)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: record build result [skip ci]"
          git push origin HEAD:main

  release:
    name: Publish v1.3.0 release
    needs: [build]
    if: ${{ github.ref == 'refs/heads/main' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download validated APK
        uses: actions/download-artifact@v4
        with:
          name: YellowPage-TR-LSPosed-v1.3-debug-APK
          path: release-apk
      - name: Publish tagged release with checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -s release-apk/app-debug.apk
          cp release-apk/app-debug.apk release-apk/YellowPage_TR_v1.3.apk
          cd release-apk
          sha256sum YellowPage_TR_v1.3.apk > SHA256SUMS.txt
          cd ..
          if gh release view v1.3.0 >/dev/null 2>&1; then
            echo 'v1.3.0 release already exists; leaving it unchanged'
            exit 0
          fi
          gh release create v1.3.0 \
            release-apk/YellowPage_TR_v1.3.apk \
            release-apk/SHA256SUMS.txt \
            --title 'YellowPage TR v1.3.0' \
            --notes-file RELEASE_NOTES_v1.3.0.md \
            --target "$RELEASE_TARGET"
