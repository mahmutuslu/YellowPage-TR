name: Build and Publish YellowPage TR API 102
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install required Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Static regression tests
        run: python3 tools/test_spam.py
      - name: JVM tests and assemble debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify Xposed API 102 and APK version
        run: |
          python3 tools/verify_apk.py
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='dev.yellowpagetr.spam'"
          "$aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "versionName='2.0.0'"
      - uses: actions/upload-artifact@v4
        with:
          name: YellowPage-TR-API102-v2.0.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: YellowPage-TR-API102-v2.0.0
          path: dist
      - name: Publish v2.0.0 signed debug APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo 'Release v2.0.0 already exists; leaving it unchanged'
            exit 0
          fi
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/YellowPage_TR_v2.0.0_API102.apk
          ( cd dist && sha256sum YellowPage_TR_v2.0.0_API102.apk > SHA256SUMS.txt )
          gh release create v2.0.0 \
            dist/YellowPage_TR_v2.0.0_API102.apk dist/SHA256SUMS.txt \
            --title 'YellowPage TR v2.0.0 — Xposed API 102 Final' \
            --notes-file RELEASE_NOTES_v2.0.0.md \
            --target "$GITHUB_SHA" \
            --latest
