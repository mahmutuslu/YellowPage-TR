plugins { id 'com.android.application' }
android {
    namespace 'dev.yellowpagetr.spam'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.yellowpagetr.spam'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
}
dependencies { compileOnly files('libs/xposed-api-stubs.jar') }
