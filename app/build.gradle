plugins { id 'com.android.application' }
android {
    namespace 'dev.yellowpagetr.spam'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.yellowpagetr.spam'
        minSdk 29
        targetSdk 32
        versionCode 20
        versionName '2.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
}
dependencies {
    // Modern libxposed is injected by an API 102 compatible framework at runtime.
    compileOnly 'io.github.libxposed:api:102.0.0'
    testImplementation 'junit:junit:4.13.2'
}
